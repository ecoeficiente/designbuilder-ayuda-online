<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="940"
     viewBox="300 56 686 560"
     role="img">
  <title>DesignBuilder España</title>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2=".15" y2="1">
      <stop offset="0" stop-color="#98D52C"/>
      <stop offset="1" stop-color="#8BCC27"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#07AEE9"/>
      <stop offset="1" stop-color="#00A8E9"/>
    </linearGradient>
    <clipPath id="flag">
      <circle cx="829" cy="494" r="90"/>
    </clipPath>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Símbolo DesignBuilder -->
  <path fill="url(#blue)"
    d="M371 376.5 H462
       C479.5 376.5 492.5 389.5 492.5 407
       V412.5 C492.5 441 511 457.5 540 457.5
       H578 C607 457.5 623.5 438 623.5 410
       V319.5 C623.5 302.5 636 289 654 289
       H835.5 C852 289 865.5 303 865.5 320
       V512 C865.5 529 852.5 542.5 835.5 542.5
       H371 C354 542.5 341.5 529 341.5 512
       V406.5 C341.5 389.5 354 376.5 371 376.5 Z"/>

  <path fill="url(#green)"
    d="M536.8 87 H725.8
       C743.4 87 757 101 757 118.7
       V243 C757 261 743.2 274.5 725.8 274.5
       H656.8 C631 274.5 609.9 295 609.9 320.5
       V411 C609.9 433 595 444 577.6 444
       H540.4 C518.9 444 506 432.5 506 411.6
       V118.5 C506 100.6 519 87 536.8 87 Z"/>

  <!-- Distintivo circular español -->
  <circle cx="835" cy="501" r="98"
          fill="#000" opacity=".16"
          filter="url(#shadow)"/>
  <circle cx="829" cy="494" r="100" fill="#fff"/>

  <g clip-path="url(#flag)">
    <rect x="739" y="404" width="180" height="180" fill="#FFCE00"/>
    <rect x="739" y="404" width="180" height="45" fill="#C8102E"/>
    <rect x="739" y="539" width="180" height="45" fill="#C8102E"/>

    <!-- Escudo estilizado de España -->
    <g transform="translate(816 495) scale(1.12)">
      <!-- Corona real -->
      <g stroke="#8A2E15" stroke-width=".9" stroke-linejoin="round">
        <path d="M-23,-24 C-23,-31 -18,-34 -16,-34
                 C-10,-40 -4,-37 0,-39
                 C4,-37 10,-40 16,-34
                 C19,-34 23,-31 23,-24
                 L20,-18 H-20 Z" fill="#F0C22C"/>
        <path d="M-22,-27 L-18,-34 L-10,-28
                 L-4,-38 L0,-27 L4,-38
                 L10,-28 L18,-34 L22,-27
                 L20,-22 H-20 Z" fill="#E8AD18"/>
        <path d="M-20,-21 Q0,-24 20,-21
                 L20,-17 Q0,-14 -20,-17 Z"
              fill="#C9162D"/>
        <path d="M-15,-28 Q0,-35 15,-28"
              fill="none" stroke="#CF142B" stroke-width="3"/>
        <circle cx="0" cy="-38" r="2.4" fill="#EFCB32"/>
        <circle cx="-14" cy="-24" r="1.7" fill="#2094C9"/>
        <circle cx="0" cy="-22" r="1.7" fill="#2094C9"/>
        <circle cx="14" cy="-24" r="1.7" fill="#2094C9"/>
      </g>

      <!-- Columnas de Hércules -->
      <g stroke="#946323" stroke-width="1">
        <path d="M-33,-8 H-26 V29 H-33 Z" fill="#F1CE43"/>
        <path d="M26,-8 H33 V29 H26 Z" fill="#F1CE43"/>
        <rect x="-36" y="-10" width="13" height="4"
              rx="1" fill="#F1C232"/>
        <rect x="23" y="-10" width="13" height="4"
              rx="1" fill="#F1C232"/>
        <rect x="-36" y="27" width="13" height="4"
              rx="1" fill="#2074B1"/>
        <rect x="23" y="27" width="13" height="4"
              rx="1" fill="#2074B1"/>
        <path d="M-35,1 Q-21,-4 -26,7
                 Q-31,12 -35,17"
              fill="none" stroke="#C8102E" stroke-width="3.5"/>
        <path d="M35,1 Q21,-4 26,7
                 Q31,12 35,17"
              fill="none" stroke="#C8102E" stroke-width="3.5"/>
      </g>

      <!-- Corona del escudo -->
      <path d="M-20,-15 L-15,-21 L-8,-17
               L-1,-23 L6,-17 L13,-21
               L20,-15 L18,-11 H-18 Z"
            fill="#F6C337" stroke="#8A3519" stroke-width="1"/>

      <!-- Escudo cuartelado -->
      <path d="M-22,-11 H22 V17
               Q21,29 0,35 Q-21,29 -22,17 Z"
            fill="#EAEFF7" stroke="#814422" stroke-width="2"/>
      <path d="M-20,-9 H0 V11 H-20 Z" fill="#C8102E"/>
      <path d="M0,-9 H20 V11 H0 Z" fill="#F8F6F3"/>
      <path d="M-20,11 H0 V29 Q-12,27 -20,18 Z"
            fill="#FFCC22"/>
      <path d="M0,11 H20 V18 Q12,27 0,29 Z"
            fill="#C8102E"/>

      <!-- Castilla -->
      <path d="M-16,5 V-2 H-14 V-6 H-11
               V-3 H-8 V-6 H-5 V-2 H-3 V5 Z"
            fill="#F4C44F" stroke="#75431A" stroke-width=".6"/>
      <rect x="-11" y="0" width="3" height="5" fill="#1C73B5"/>

      <!-- León -->
      <path d="M10,-5 L13,-3 L11,0 L15,3
               L11,3 L10,7 L7,5 L6,1
               L9,-1 L7,-3 Z"
            fill="#AE1F60"/>

      <!-- Aragón -->
      <path d="M-16,12 V25 M-11,12 V27 M-6,12 V29"
            stroke="#C8102E" stroke-width="2.4"/>

      <!-- Navarra -->
      <path d="M4,12 L15,23 M15,12 L4,23
               M9.5,11 V26 M3,17.5 H17"
            stroke="#E8C144" stroke-width="2.1"/>
      <circle cx="9.5" cy="17.5" r="2.1"
              fill="#227A45" stroke="#E5C85A" stroke-width=".9"/>

      <!-- Escusón borbónico -->
      <ellipse cx="0" cy="9" rx="5" ry="7"
               fill="#2269B4" stroke="#F3D45B" stroke-width="1.4"/>
      <path d="M-2,6 l2,2 l2,-2 M-2,11 l2,2 l2,-2"
            stroke="#F3CF48" fill="none" stroke-width="1"/>
    </g>
  </g>

  <!-- Contorno blanco -->
  <circle cx="829" cy="494" r="94"
          fill="none" stroke="#fff" stroke-width="8"/>
</svg>
